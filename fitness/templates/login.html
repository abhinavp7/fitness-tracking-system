<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css" />

        <style>
    body {
        background: linear-gradient(135deg, #e0e7ff, #f8fafc);
        font-family: 'Segoe UI', sans-serif;
        height: 100vh;
    }

    .form-container {
        width: 100%;
        max-width: 420px;
    }

    .form-box {
        background: white;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        animation: fadeIn 0.6s ease;
    }

    h2 {
        font-weight: 600;
        color: #1e3a8a;
    }

    input {
        border-radius: 10px !important;
        padding: 10px;
        border: 1px solid #e2e8f0;
    }

    input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 0.15rem rgba(37, 99, 235, 0.2);
    }

    .btn-success {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        border: none;
        border-radius: 10px;
        padding: 10px;
        font-weight: 500;
        transition: 0.2s;
    }

    .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(34,197,94,0.3);
    }

    .btn-secondary {
        border-radius: 10px;
    }

    .alert {
        max-width: 420px;
    }

    .link-text {
        font-size: 14px;
        text-align: center;
        margin-top: 10px;
    }

    .link-text a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
    }

    .link-text a:hover {
        text-decoration: underline;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>
   <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css" />
</head>

<body>
    {% block form %}
<div class="d-flex justify-content-center align-items-center vh-100 flex-column">

    {% if messages %}
        {% for i in messages %}
        <div class="alert alert-{{ i.tags }} alert-dismissible fade show">
            {{ i }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}

    <div class="form-container">
        <div class="form-box">

            <h2 class="text-center mb-4">Login</h2>

            <form method="post">
                {% csrf_token %}

                {{ form.non_field_errors }}

                <div class="mb-3">
                    {{ form.username }}
                    {{ form.username.errors }}
                </div>

                <div class="mb-3">
                    {{ form.password }}
                    {{ form.password.errors }}
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Login
                </button>
            </form>

            <div class="link-text">
                New here? <a href="{% url 'user_register' %}">Create account</a>
            </div>

        </div>
    </div>
</div>
    </div>
    {% endblock %}

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
