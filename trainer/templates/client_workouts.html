<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css" />

    <title>My Workouts</title>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #020617);
            font-family: 'Segoe UI', sans-serif;
            color: #e2e8f0;
        }

        .main-container {
            max-width: 700px;
            margin: auto;
            margin-top: 50px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .title {
            color: #60a5fa;
            font-weight: 600;
        }

        .back-btn {
            text-decoration: none;
            color: #94a3b8;
            font-size: 14px;
        }

        .back-btn:hover {
            color: #60a5fa;
        }

        .workout-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: 0.25s;
        }

        .workout-card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
            box-shadow: 0 15px 35px rgba(59,130,246,0.2);
        }

        .exercise {
            font-size: 18px;
            font-weight: 600;
        }

        .details {
            font-size: 14px;
            color: #94a3b8;
        }

        .date {
            font-size: 12px;
            color: #64748b;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 30px;
        }
    </style>

</head>

<body>

<div class="main-container">

    <!-- HEADER -->
    <div class="header">
        <h3 class="title">My Workouts</h3>
        <a href="{% url 'workout' %}" class="back-btn">← Back</a>
    </div>

    <!-- WORKOUT LIST -->
    {% for workout in workouts %}
    <div class="workout-card">

        <div class="exercise">{{ workout.exercise }}</div>

        <div class="details mt-1">
            {{ workout.sets }} sets × {{ workout.reps }} reps • {{ workout.weight }} kg
        </div>

        <div class="date mt-2">
            {{ workout.date|date:"M d, Y" }}
        </div>

    </div>
    {% empty %}
    <div class="empty">No workouts assigned yet</div>
    {% endfor %}

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
