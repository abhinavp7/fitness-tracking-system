<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css" />

    <title>Trainer Dashboard</title>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #020617);
            font-family: 'Segoe UI', sans-serif;
            color: #e2e8f0;
        }

        .main-container {
            max-width: 900px;
            margin: auto;
            margin-top: 50px;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .title {
            color: #60a5fa;
            font-weight: 600;
        }

        .user-info {
            font-size: 13px;
            color: #94a3b8;
        }

        .btn-danger {
            border-radius: 10px;
            background: #ef4444;
            border: none;
        }

        .section-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #94a3b8;
        }

        .item-card {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.25s;
        }

        .item-card:hover {
            transform: translateY(-3px);
            border-color: #3b82f6;
            box-shadow: 0 10px 25px rgba(59,130,246,0.15);
        }

        .btn-sm {
            border-radius: 8px;
        }

        .btn-success {
            background: #22c55e;
            border: none;
        }

        .btn-outline-danger {
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-outline-danger:hover {
            background: #ef4444;
            color: #fff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
        }

        .empty-text {
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="main-container">

    <!-- HEADER -->
    <div class="header">
        <div>
            <h4 class="title">Trainer Dashboard</h4>
            <div class="user-info">Logged in as: {{ request.user.username }}</div>
        </div>

        <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Logout</a>
    </div>

    <!-- REQUESTS -->
    <div class="glass-card">
        <div class="section-title">Pending Requests</div>

        {% for r in req %}
        <div class="item-card">
            <span>{{ r.client.username }}</span>

            <div>
                <a href="{% url 'accept_request' r.id %}" class="btn btn-sm btn-success">Accept</a>
                <a href="{% url 'reject_request' r.id %}" class="btn btn-sm btn-outline-danger">Reject</a>
            </div>
        </div>
        {% empty %}
        <div class="empty-text">No pending requests</div>
        {% endfor %}
    </div>

    <!-- CLIENTS -->
    <div class="glass-card">
        <div class="section-title">Your Clients</div>

        {% for c in client %}
        <div class="item-card">
            <span>{{ c.client.username }}</span>

            <a href="{% url 'client_detail' c.client.id %}" class="btn btn-sm btn-primary">
                View
            </a>
        </div>
        {% empty %}
        <div class="empty-text">No clients yet</div>
        {% endfor %}
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
