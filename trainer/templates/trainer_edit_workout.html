<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css" />

  <title>Edit Workout</title>

  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #020617);
      font-family: 'Segoe UI', sans-serif;
      color: #e2e8f0;
    }

    .main-card {
      max-width: 600px;
      margin: auto;
      margin-top: 50px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .title {
      text-align: center;
      font-weight: 600;
      margin-bottom: 25px;
      color: #60a5fa;
    }

    .form-control {
      background: #020617;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 10px;
      padding: 12px;
    }

    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 0.15rem rgba(59, 130, 246, 0.25);
      background: #020617;
      color: #fff;
    }

    .form-label {
      color: #94a3b8;
      font-size: 14px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 10px;
      width: 100%;
      padding: 10px;
      transition: 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
    }

    .btn-secondary {
      border-radius: 10px;
    }

    .video-box {
      margin-top: 25px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #334155;
      transition: 0.3s;
    }

    .video-box:hover {
      transform: scale(1.01);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .video-title {
      margin-top: 20px;
      font-size: 16px;
      color: #94a3b8;
    }

    .back-link {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      color: #94a3b8;
      font-size: 14px;
    }

    .back-link:hover {
      color: #60a5fa;
    }
  </style>

</head>

<body>

  <div class="main-card">

    <h3 class="title">Edit Workout</h3>

    <form method="post">
      {% csrf_token %}

      <input class="form-control mb-3" name="exercise" value="{{ workout.exercise }}" placeholder="Exercise Name">

      <div class="row">
        <div class="col">
          <input class="form-control mb-3" name="sets" value="{{ workout.sets }}" placeholder="Sets">
        </div>
        <div class="col">
          <input class="form-control mb-3" name="reps" value="{{ workout.reps }}" placeholder="Reps">
        </div>
      </div>

      <input class="form-control mb-3" name="weight" value="{{ workout.weight }}" placeholder="Weight (kg)">

      <!-- VIDEO -->
      <label class="form-label">Workout Video Link</label>
      <input type="url" name="video" class="form-control mb-4" placeholder="Paste YouTube embed link"
        value="{{ workout.video }}">

      <button type="submit" class="btn btn-primary">Update Workout</button>
    </form>

    <!-- VIDEO PREVIEW -->
    {% if workout.video %}
    <div class="video-title">Current Video</div>

    <div class="video-box ratio ratio-16x9">
      <iframe src="{{ workout.video }}" allowfullscreen></iframe>
    </div>
    {% endif %}

    <a href="{% url 'trainer_dashboard' %}" class="back-link">← Back to Dashboard</a>

  </div>

</body>

</html>
