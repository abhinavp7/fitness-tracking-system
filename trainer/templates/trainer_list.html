<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css"
    />

    <title>Trainers</title>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #020617);
            font-family: 'Segoe UI', sans-serif;
            color: #e2e8f0;
        }

        .main-card {
            max-width: 750px;
            margin: auto;
            margin-top: 60px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-weight: 600;
            color: #60a5fa;
        }

        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            color: #60a5fa;
        }

        .trainer-card {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.25s;
        }

        .trainer-card:hover {
            transform: translateY(-3px);
            border-color: #3b82f6;
            box-shadow: 0 10px 25px rgba(59,130,246,0.15);
        }

        .trainer-name {
            font-weight: 500;
        }

        .btn-request {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            padding: 6px 12px;
            transition: 0.3s;
        }

        .btn-request:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(59,130,246,0.3);
        }

        .empty-text {
            color: #94a3b8;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="main-card">

    <!-- Alerts -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <!-- Header -->
    <div class="header">
        <h4 class="title">Available Trainers</h4>
        <a href="{% url 'workout' %}" class="back-btn">← Back</a>
    </div>

    <!-- Trainer List -->
    {% for t in trainers %}
    <div class="trainer-card">
        <span class="trainer-name">{{ t.username }}</span>

        <a href="{% url 'send_request' t.id %}" class="btn btn-request">
            Request
        </a>
    </div>
    {% empty %}
        <div class="empty-text">No trainers available</div>
    {% endfor %}

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
